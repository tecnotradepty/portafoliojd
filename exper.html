<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Identidad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* --- TOKENS GLOBALES --- */
        :root {
            --brand-purple: #6B00FF;
            --text-dark: #1A1A1A;
            
            --font-display: 'Anton', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
        }

        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-color: #050505;
        }

        /* ─── FONDO AMBIENTAL FIJO (ARCOÍRIS VINTAGE) ─── */
        .ambient-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/898fe9138c643947559443d1dd3308d9f68b8371/DIQC/file_00000000a3d8822fb9c9ef28e8378e52.png');
            background-position: center; background-size: cover; background-repeat: no-repeat;
            z-index: -2;
        }

        /* Ruido Analógico Sutil */
        .noise-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.04;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* ─── NAVBAR SUPERIOR MINIMALISTA ─── */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 2rem 4vw;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; pointer-events: none;
        }
        
        .menu-trigger {
            pointer-events: auto; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 10px 20px; font-family: var(--font-code); font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(10px); border-radius: 50px; transition: all 0.3s;
        }
        .menu-trigger:hover { background: var(--brand-purple); border-color: var(--brand-purple); }

        /* ─── SECCIÓN 1: HERO (TÍTULO Y LOGO) ─── */
        .hero-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vw;
            overflow: hidden;
            /* Cero cajas, cero fondos extra. El lienzo es la pantalla. */
        }

        .hero-sandwich {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .hero-giant-text {
            font-family: var(--font-display);
            font-size: clamp(5rem, 18vw, 22rem);
            line-height: 0.85;
            text-align: center;
            margin: 0;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }
        .hero-giant-text div { display: flex; justify-content: center; align-items: center; gap: 0.8vw; }

        /* Letras Traseras: Morado Sólido con Volumen CSS */
        .solid-purple-letter {
            color: var(--brand-purple);
            display: inline-block;
            position: relative;
            text-shadow: 
                0px 1px 0px #4A00B3, 0px 2px 0px #4A00B3, 0px 3px 0px #4A00B3, 0px 4px 0px #4A00B3, 
                0px 5px 0px #4A00B3, 0px 6px 0px #35008B, 0px 7px 0px #35008B, 
                0px 15px 15px rgba(0, 0, 0, 0.2), 0px 75px 25px rgba(0, 0, 0, 0.45);
        }

        /* Letras Delanteras: Liquid Glass (Pasan por encima del logo) */
        .liquid-glass-letter {
            font-family: var(--font-display);
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(0, 240, 255, 0.1) 20%, rgba(255, 255, 255, 0.0) 40%, rgba(255, 255, 255, 0.0) 60%, rgba(255, 0, 60, 0.1) 80%, rgba(255, 255, 255, 0.3) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.05); -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 75px 25px rgba(0, 0, 0, 0.45));
            backdrop-filter: blur(2px) saturate(110%); -webkit-backdrop-filter: blur(2px) saturate(110%);
            position: relative; 
        }

        /* Control estricto de Z-Index para el Sandwich */
        .z-back { z-index: 1; position: relative; }
        .z-front { z-index: 10; position: relative; }
        .overlap-t { z-index: 25 !important; position: relative; }
        .overlap-i-behind { z-index: 15 !important; position: relative; margin-left: -0.08em; }

        /* Logo Original Flotante (Ingravidez en el medio) */
        .giant-transparent-logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: clamp(260px, 45vw, 750px);
            z-index: 5; /* Exactamente entre z-back (1) y z-front (10) */
            animation: floatLogo 8s ease-in-out infinite; 
            pointer-events: none;
            filter: drop-shadow(0px 85px 30px rgba(0, 0, 0, 0.55));
        }

        @keyframes floatLogo { 
            0% { transform: translate(-50%, -50%); } 
            50% { transform: translate(-50%, -54%) rotate(3deg); } 
            100% { transform: translate(-50%, -50%); } 
        }

        /* Animación independiente para letras */
        @keyframes floatLetter { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .float-anim { display: inline-block; animation: floatLetter 9s ease-in-out infinite; }
        .delay-1 { animation-delay: 0s; } .delay-2 { animation-delay: 1.5s; } .delay-3 { animation-delay: 3s; } .delay-4 { animation-delay: 4.5s; } .delay-5 { animation-delay: 6s; } .delay-6 { animation-delay: 7.5s; }

        @media (max-width: 768px) {
            .hero-giant-text { font-size: 22vw; gap: 1vw; } 
            .hero-giant-text div { gap: 1.5vw; } 
            .giant-transparent-logo { width: 70vw; }
            .top-nav { padding: 1.5rem 4vw; }
        }
    </style>
</head>
<body>

    <div class="ambient-canvas"></div>
    <div class="noise-overlay"></div>

    <div class="top-nav">
        <button class="menu-trigger" id="openMenuBtn">
            <span style="font-size: 1.2rem;">&equiv;</span> SYSTEM.MENU
        </button>
    </div>

    <section class="hero-section" id="inicio">
        <div class="hero-sandwich">
            
            <h1 class="hero-giant-text">
                <div>
                    <span class="z-back solid-purple-letter delay-1">D</span>
                    <span class="z-front liquid-glass-letter float-anim delay-1">I</span>
                    <span class="z-back solid-purple-letter">S</span>
                    <span class="z-front solid-purple-letter float-anim delay-2">K</span>
                </div>
                <div>
                    <span class="z-front solid-purple-letter float-anim delay-3">C</span>
                    <span class="z-back solid-purple-letter delay-4">R</span>
                    <span class="z-front liquid-glass-letter float-anim delay-4">E</span>
                    <span class="z-back solid-purple-letter delay-5">A</span>
                    <span class="z-front liquid-glass-letter overlap-t float-anim delay-5">T</span>
                    <span class="z-back solid-purple-letter overlap-i-behind">I</span>
                    <span class="z-back solid-purple-letter delay-6">V</span>
                    <span class="z-front solid-purple-letter float-anim delay-6">O</span>
                </div>
            </h1>

            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/ed7bde104e48f0053fe95b3a44da8543e282ba9f/DIQC/1784652017836.png" alt="Disk Creativo Logo" class="giant-transparent-logo" id="dynamic-logo">
            
        </div>
    </section>

    <section id="identidad" style="min-height: 100vh; position: relative; z-index: 10;"></section>
    <section id="proyectos" style="min-height: 100vh; position: relative; z-index: 10;"></section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Efecto Parallax en el CD (Sensible al Mouse)
            const heroContainer = document.getElementById('inicio');
            const logo = document.getElementById('dynamic-logo');
            
            if(heroContainer && logo && window.innerWidth > 768) {
                heroContainer.addEventListener('mousemove', (e) => {
                    const rect = heroContainer.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    
                    // Movimiento sutil y elegante de la maqueta
                    logo.style.transform = `translate(calc(-50% + ${x * -40}px), calc(-50% + ${y * -40}px))`;
                });
                
                heroContainer.addEventListener('mouseleave', () => { 
                    logo.style.transform = ''; 
                });
            }
        });
    </script>
</body>
</html>
