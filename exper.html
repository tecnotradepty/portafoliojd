<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Hero Sandwich Texturizado Sandbox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Variables Core */
            --bg-primary: #050505;
            --brand-purple: #6B00FF;
            --accent-neon: #00FF66;
            --text-main: #EAE9E4; 
            --hairline: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Tipografía */
            --font-display: 'Anton', sans-serif;
            --font-sans: 'Inter', sans-serif;

            /* ACTU: TEXTURA DE MARCA (NUEVA IMAGEN SUBIDA -image_ca62f4.jpg-) */
            --brand-texture-url: url('image_ca62f4.jpg');

            /* Material de Cubos Flotantes (Gris Sólido) */
            --cube-edge: rgba(255, 255, 255, 0.15);
            --c-bright: #999999;
            --c-mid: #666666;
            --c-dark: #444444;
            --c-deep: #222222;
        }

        /* ─── RESET Y BASE ─── */
        html, body { overflow-x: clip; max-width: 100%; width: 100%; scroll-behavior: smooth; height: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { color: var(--text-main); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; background-color: var(--bg-primary); min-height: 100%; overflow: hidden; }

        /* ─── FONDOS Y ATMÓSFERA ─── */
        .ambient-canvas {
            position: fixed; top: -5vh; left: 0; width: 100vw; height: 110vh; 
            background: var(--bg-primary) url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/27a5f1ff96e9d1b4c4a205126ccbcba5a9b57582/DIQC/file_000000006e7481fd87c722d8d1370ae9.png') center/cover no-repeat fixed;
            z-index: -3; filter: brightness(0.9) saturate(1.1);
        }
        .stars-container { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .stars-1, .stars-2 { position: absolute; background: transparent; }
        .stars-1 { width: 1px; height: 1px; box-shadow: 15vw 20vh #FFF, 40vw 60vh #FFF, 80vw 15vh #FFF, 25vw 85vh #FFF, 60vw 30vh #FFF, 90vw 70vh #FFF, 10vw 45vh #FFF, 70vw 80vh #FFF; animation: twinkle 40s infinite alternate ease-in-out; }
        .stars-2 { width: 2px; height: 2px; box-shadow: 35vw 10vh #FFF, 85vw 50vh #FFF, 50vw 85vh #FFF, 15vw 70vh #FFF, 75vw 25vh #FFF; animation: twinkle 60s infinite alternate-reverse ease-in-out; }
        @keyframes twinkle { 0% { opacity: 0.1; } 100% { opacity: 0.4; } }

        /* ─── NAVBAR PREMIUM ─── */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: var(--hairline); display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: 2000; transition: transform 0.3s ease;
        }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #fff; letter-spacing: 2px; text-decoration: none; text-transform: uppercase; }
        .brand-icon { height: 22px; width: auto; }
        .navbar-links { display: flex; gap: 3rem; align-items: center; }
        .nav-link { color: var(--text-main); text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-link:hover { color: var(--brand-purple); }
        .nav-btn-wa {
            background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1.2rem; border-radius: 50px; text-decoration: none; font-size: 0.75rem; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s; text-transform: uppercase;
        }
        .nav-btn-wa svg { width: 14px; height: 14px; fill: currentColor; }
        .nav-btn-wa:hover { background: #25D366; border-color: #25D366; color: #000; }

        /* ─── HERO SECTION ─── */
        .hero-section { position: relative; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2vw; padding-top: 70px; z-index: 10; }
        .hero-sandwich { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; z-index: 10; }
        
        .hero-giant-text {
            font-family: var(--font-display); font-size: clamp(3rem, 15vw, 22rem);
            line-height: 0.85; text-align: center; margin: 0; text-transform: uppercase;
            display: flex; flex-direction: column; gap: clamp(1rem, 5vh, 4rem); letter-spacing: -2px; width: 100%;
        }
        .hero-giant-text div { display: flex; justify-content: center; align-items: center; gap: 0.8vw; flex-wrap: wrap; }

        /* ─── SANDWICH TIPOGRÁFICO CORREGIDO & OPTIMIZADO ─── */
        
        /* h1 duplicado para sandwich modular limpio */
        .hero-giant-text.h1-front { position: absolute; inset: 0; }

        /* CAPA TRASERA (D, S, K, C, R, A, I, V, O): TEXTURA MARRÓN/DORADA + VOLUMEN MATE NEGRO */
        .solid-gray-letter {
            display: inline-block; position: relative;
            background-image: var(--brand-texture-url);
            background-size: cover; background-position: center;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            /* ACTU: Sombras negras semi-transparentes apiladas para volumen mate que respeta el color de textura, erradicando el gris neutro */
            text-shadow: 
                0px 1px 0px rgba(0, 0, 0, 0.3), 
                0px 2px 0px rgba(0, 0, 0, 0.4),
                0px 3px 0px rgba(0, 0, 0, 0.5),
                0px 4px 0px rgba(0, 0, 0, 0.6), 
                0px 5px 0px rgba(0, 0, 0, 0.7),
                0px 6px 0px rgba(0, 0, 0, 0.8),
                0px 7px 0px rgba(0, 0, 0, 0.9),
                0px 15px 15px rgba(0, 0, 0, 0.5), 
                0px 30px 25px rgba(0, 0, 0, 0.7);
        }
        
        /* CAPA FRONTAL (I, E, T): ACRÍLICO OSCURO (Mantenido) */
        .acrylic-letter {
            font-family: var(--font-display); display: inline-block; position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(20,20,20,0.8) 20%, rgba(5,5,5,0.9) 45%, rgba(255,255,255,0.8) 50%, rgba(5,5,5,0.9) 55%, rgba(20,20,20,0.8) 80%, rgba(255,255,255,0.3) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35);
            filter: drop-shadow(0px 30px 20px rgba(0, 0, 0, 0.7));
        }

        /* Ocultar letras invisibles del front para alineación modular */
        .acrylic-letter.invisible { visibility: hidden; }

        .z-back { z-index: 1 !important; position: relative; }
        .z-front { z-index: 10 !important; position: relative; }
        .overlap-t { z-index: 25 !important; position: relative; }
        .overlap-i-behind { z-index: 1 !important; position: relative; margin-left: -0.08em; }

        /* CD CENTRAL FLOTANTE */
        .giant-transparent-logo {
            position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); 
            width: clamp(120px, 18vw, 320px); z-index: 5; pointer-events: none;
            filter: drop-shadow(0px 20px 15px rgba(0, 0, 0, 0.95));
            animation: mechanicalFloat 10s ease-in-out infinite; 
        }

        @keyframes mechanicalFloat { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -52%); } }
        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .float-anim { display: inline-block; animation: floatLetter 9s ease-in-out infinite; }

        /* BOTÓN REPRODUCTOR */
        .hero-reproductor-btn {
            display: block; margin-top: 5rem; width: 90%; max-width: 400px;
            position: relative; z-index: 20; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.8));
        }
        .hero-reproductor-btn img { width: 100%; height: auto; display: block; }
        .hero-reproductor-btn:hover { transform: translateY(4px); filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.9)); }
        .hero-reproductor-btn:active { transform: translateY(10px); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.95)); }

        /* CUBOS 3D (Gris Sólido/Mate) */
        .floating-ecosystem {
            position: absolute; inset: 0; pointer-events: none; overflow: hidden; 
            z-index: 1; perspective: 3000px; 
        }
        .cube-container { position: absolute; transform-style: preserve-3d; filter: drop-shadow(0 15px 40px rgba(0,0,0,0.9)); }
        .cube-object { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
        
        .c-f {
            position: absolute; width: 100%; height: 100%;
            border: 1px solid var(--cube-edge); backface-visibility: visible; opacity: 1;
        }
        
        /* Material Gris Geométrico (Mantenido) */
        .f { transform: translateZ(calc(var(--size) / 2)); background: var(--c-bright); }
        .bk { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); background: var(--c-deep); }
        .L { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); background: var(--c-mid); }
        .R { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); background: var(--c-dark); }
        .T { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); background: var(--c-bright); }
        .B { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); background: var(--c-dark); }

        /* Animaciones Físicas */
        @keyframes slowRotate1 { to { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes slowRotate2 { to { transform: rotateX(-180deg) rotateY(360deg) rotateZ(90deg); } }
        @keyframes slowRotate3 { to { transform: rotateX(90deg) rotateY(-180deg) rotateZ(360deg); } }
        @keyframes slowRotate4 { to { transform: rotateX(-360deg) rotateZ(-180deg); } }
        @keyframes spaceDrift { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(30px, -20px); } 66% { transform: translate(-15px, 25px); } }

        /* Nodos Flotantes (DoF) */
        .sym-1 { --size: clamp(8rem, 15vw, 18rem); width: var(--size); height: var(--size); top: 10%; left: 5%; filter: blur(8px) drop-shadow(0 20px 50px rgba(0,0,0,0.95)); z-index: 30; animation: spaceDrift 60s infinite ease-in-out; }
        .sym-1 .cube-object { animation: slowRotate1 95s infinite linear; }
        
        .sym-2 { --size: clamp(3rem, 6vw, 6rem); width: var(--size); height: var(--size); top: 25%; right: 15%; opacity: 0.7; animation: spaceDrift 75s infinite ease-in-out reverse -10s; }
        .sym-2 .cube-object { animation: slowRotate2 120s infinite linear -15s; }
        
        .sym-3 { --size: clamp(2.5rem, 5vw, 5rem); width: var(--size); height: var(--size); bottom: 25%; left: 18%; filter: blur(1px); opacity: 0.6; animation: spaceDrift 90s infinite ease-in-out -25s; }
        .sym-3 .cube-object { animation: slowRotate3 105s infinite linear -5s; }
        
        .sym-4 { --size: clamp(1.5rem, 3vw, 3rem); width: var(--size); height: var(--size); top: 60%; right: 35%; filter: blur(2.5px); opacity: 0.2; animation: spaceDrift 80s infinite linear reverse -40s; }
        .sym-4 .cube-object { animation: slowRotate4 130s infinite linear; }

        /* CINTA ANALÓGICA */
        .analog-cut { width: 100%; height: 6vh; min-height: 40px; background: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/0bc1cbae60e585237d38e03ea2fa9c12a7231d0a/DIQC/IMG_20260723_145416.jpg') center/cover no-repeat; position: absolute; bottom: 0; z-index: 25; border-top: var(--hairline); box-shadow: 0 -10px 40px rgba(0,0,0,0.9); }

        /* ─── RESPONSIVE MÓVIL ─── */
        @media (max-width: 900px) {
            .top-navbar { padding: 0 4vw; height: 60px; }
            .navbar-brand { font-size: 0.75rem; gap: 4px; }
            .navbar-brand span { display: none; } 
            .brand-icon { height: 18px; }
            .navbar-links { display: flex; gap: 1rem; } 
            .nav-link { font-size: 0.6rem; }
            .nav-btn-wa { padding: 0.4rem 0.8rem; font-size: 0.6rem; gap: 4px;}
            .nav-btn-wa svg { width: 12px; height: 12px; }
            .hero-giant-text { font-size: 19vw; gap: 3vh; line-height: 0.9;} 
            .giant-transparent-logo { width: clamp(100px, 25vw, 150px); top: 26%; }
            .hero-reproductor-btn { width: 85%; margin-top: 3rem; }
            .sym-1 { top: 5%; left: -10%; } .sym-2 { top: 20%; right: 5%; } .sym-3 { bottom: 20%; left: 5%; }
        }
    </style>
</head>
<body>

    <div class="ambient-canvas" id="parallaxBg"></div>

    <div class="stars-container">

    <div class="floating-ecosystem">
        <div class="cube-container sym-1"><div class="cube-object"><div class="c-f f"></div><div class="c-f bk"></div><div class="c-f L"></div><div class="c-f R"></div><div class="c-f T"></div><div class="c-f B"></div></div></div>
        <div class="cube-container sym-2"><div class="cube-object"><div class="c-f f"></div><div class="c-f bk"></div><div class="c-f L"></div><div class="c-f R"></div><div class="c-f T"></div><div class="c-f B"></div></div></div>
        <div class="cube-container sym-3"><div class="cube-object"><div class="c-f f"></div><div class="c-f bk"></div><div class="c-f L"></div><div class="c-f R"></div><div class="c-f T"></div><div class="c-f B"></div></div></div>
        <div class="cube-container sym-4"><div class="cube-object"><div class="c-f f"></div><div class="c-f bk"></div><div class="c-f L"></div><div class="c-f R"></div><div class="c-f T"></div><div class="c-f B"></div></div></div>
    </div>

    <nav class="top-navbar" id="topNavbar">

            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/ea71a2a658c405870ed1a44f792c411025c2e937/DIQC/1785538967768.png" alt="Disk Icon" class="brand-icon">

    <section class="hero-section" id="inicio">

                <div>
                    <span class="solid-gray-letter">D</span><span class="solid-gray-letter">S</span><span class="solid-gray-letter">K</span>
                </div>
                <div>
                    <span class="solid-gray-letter">C</span><span class="solid-gray-letter">R</span><span class="solid-gray-letter">A</span><span class="solid-gray-letter overlap-i-behind">I</span><span class="solid-gray-letter">V</span><span class="solid-gray-letter">O</span>

            </h1>

            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/93b5261029d61bf88eee569ffe36701e636d2899/DIQC/discoC.png" alt="Disk Creativo Render 3D" class="giant-transparent-logo" id="dynamic-logo">
            
            <h1 class="hero-giant-text z-front h1-front">
                <div>
                    <span class="acrylic-letter invisible">D</span><span class="acrylic-letter float-anim">I</span><span class="acrylic-letter invisible">S</span><span class="acrylic-letter invisible">K</span>
                </div>
                <div>
                    <span class="acrylic-letter invisible">C</span><span class="acrylic-letter invisible">R</span><span class="acrylic-letter float-anim">E</span><span class="acrylic-letter invisible">A</span><span class="acrylic-letter float-anim overlap-t">T</span><span class="acrylic-letter invisible">I</span><span class="acrylic-letter invisible">V</span><span class="acrylic-letter invisible">O</span>
                </div>

            <a href="dex.html" class="hero-reproductor-btn">

            </a>
        </div>

    <div class="analog-cut"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dynamicLogo = document.getElementById('dynamic-logo');
            const heroContainer = document.getElementById('inicio');
            
            if(heroContainer && dynamicLogo && window.innerWidth > 768) {
                heroContainer.addEventListener('mousemove', (e) => {
                    const rect = heroContainer.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    dynamicLogo.style.transform = `translate(calc(-50% + ${x * -40}px), calc(-50% + ${y * -40}px))`;
                });
                heroContainer.addEventListener('mouseleave', () => { dynamicLogo.style.transform = 'translate(-50%, -50%)'; });
            }
        });
    </script>
