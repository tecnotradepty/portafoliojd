<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Terminal Experimental</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        /* ─── 00. VARIABLES Y RESETEO (BRUTALISMO PURO) ─── */
        :root {
            --bg-primary: #050505;
            --bg-terminal: #000000;
            --brand-purple: #6B00FF;
            --accent-neon: #00FF66;
            --text-main: #EAE9E4; 
            --text-muted: rgba(234, 233, 228, 0.4);
            --hairline: 1px solid rgba(255, 255, 255, 0.15);
            --hairline-neon: 1px solid var(--accent-neon);
            
            --font-display: 'Anton', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --font-code: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            overflow-x: clip !important; 
            max-width: 100%; width: 100%;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* ─── 01. LIENZO ESPACIAL Y ESTRELLAS LENTAS ─── */
        .ambient-canvas {
            position: fixed; inset: -5vh 0 0 0; 
            width: 100vw; height: 110vh; 
            background: var(--bg-primary) url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/c97611b6a556fa85d00e302313fd0dbfab2e3406/DIQC/file_00000000c60481f7b7f5519059d41ed9.png') center/cover no-repeat fixed;
            z-index: -3; filter: brightness(0.9) saturate(1.1);
        }

        .stars-container { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .star-layer { position: absolute; background: transparent; }
        
        .stars-1 {
            width: 1px; height: 1px; 
            box-shadow: 15vw 20vh #FFF, 40vw 60vh #FFF, 80vw 15vh #FFF, 25vw 85vh #FFF, 60vw 30vh #FFF, 90vw 70vh #FFF, 10vw 45vh #FFF, 70vw 80vh #FFF;
            animation: pulse-slow 40s infinite alternate ease-in-out;
        }
        .stars-2 {
            width: 2px; height: 2px;
            box-shadow: 35vw 10vh #FFF, 85vw 50vh #FFF, 50vw 85vh #FFF, 15vw 70vh #FFF, 75vw 25vh #FFF;
            animation: pulse-slow 60s infinite alternate-reverse ease-in-out;
        }
        @keyframes pulse-slow { 0% { opacity: 0.1; } 100% { opacity: 0.4; } }

        /* ─── 02. NAVBAR (GUILLOTINA QUIRÚRGICA - CERO GLASSMORPHISM) ─── */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: transparent; /* Cero cristal */
            border-bottom: var(--hairline); /* Corte sólido */
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: 2000;
        }

        .navbar-brand { 
            font-family: var(--font-code); font-size: 0.85rem; font-weight: 600; 
            color: #fff; letter-spacing: 2px; text-decoration: none; text-transform: uppercase;
        }

        .navbar-links { display: flex; gap: 3rem; align-items: center; }
        .nav-link {
            color: var(--text-muted); text-decoration: none; 
            font-family: var(--font-code); font-size: 0.75rem; 
            text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s;
        }
        .nav-link:hover { color: #fff; }

        /* ─── 03. HERO SECTION Y RENDER 3D ─── */
        .hero-section {
            position: relative; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 70px 2vw 0; z-index: 10;
        }
        
        .hero-sandwich { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; z-index: 10; }
        
        .hero-giant-text {
            font-family: var(--font-display); font-size: clamp(3rem, 15vw, 22rem);
            line-height: 0.85; text-align: center; text-transform: uppercase;
            display: flex; flex-direction: column; gap: 0; letter-spacing: -2px; margin: 0;
        }
        .hero-giant-text div { display: flex; justify-content: center; align-items: center; }

        /* Capas Sólidas (Sin degradados raros, solo morado y blanco) */
        .solid-purple-letter { color: var(--brand-purple); position: relative; z-index: 1; }
        .solid-white-letter { color: #fff; position: relative; z-index: 10; }
        .overlap-i-behind { z-index: 1 !important; margin-left: -0.05em; }

        /* LOGO 3D (Renderizado físico) */
        .giant-transparent-logo {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: clamp(150px, 25vw, 420px);
            z-index: 5; pointer-events: none;
            /* Eliminado el resplandor falso. Se asume que el PNG trae su propia sombra/luz */
            filter: drop-shadow(0px 30px 15px rgba(0, 0, 0, 0.8));
            animation: mechanicalFloat 10s ease-in-out infinite; 
        }

        @keyframes mechanicalFloat { 
            0%, 100% { transform: translate(-50%, -50%); } 
            50% { transform: translate(-50%, -52%); } 
        }

        /* ─── 04. TELEMETRÍA Y BOTÓN MECÁNICO (CERO NEÓN GLOW) ─── */
        .telemetry-data {
            font-family: var(--font-code); font-size: clamp(0.6rem, 1vw, 0.8rem);
            color: var(--text-muted); margin-top: 3rem; text-transform: uppercase; 
            letter-spacing: 2px; text-align: center;
        }
        .telemetry-data span { color: #fff; }

        .btn-mechanical {
            margin-top: 2rem; background: var(--bg-primary);
            color: var(--accent-neon); border: var(--hairline-neon);
            padding: 1.2rem 2.5rem; font-family: var(--font-code); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
            cursor: pointer; position: relative;
            /* Sombra dura, brutalista, cero difuminación */
            box-shadow: 6px 6px 0px var(--accent-neon);
            transition: all 0.1s linear; z-index: 20; outline: none;
        }
        .btn-mechanical:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0px var(--accent-neon);
            background: #111;
        }
        .btn-mechanical:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--accent-neon);
        }

        /* ─── 05. TERMINAL MODAL (SISTEMA LINUX / BRUTALISTA) ─── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(5, 5, 5, 0.95);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.is-active { opacity: 1; pointer-events: auto; }

        .terminal-window {
            width: 90vw; max-width: 1000px; height: 80vh; max-height: 600px;
            background: var(--bg-primary); border: var(--hairline);
            display: flex; flex-direction: column;
            transform: translateY(20px) scale(0.98); transition: all 0.3s ease;
        }
        .modal-overlay.is-active .terminal-window { transform: translateY(0) scale(1); }

        /* Window Header (Estilo Linux Mate) */
        .terminal-header {
            height: 40px; border-bottom: var(--hairline); background: #0A0A0C;
            display: flex; justify-content: space-between; align-items: center; padding: 0 1rem;
        }
        .window-controls { display: flex; gap: 8px; }
        .win-dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-r { background: #552222; } /* Rojo mate */
        .dot-y { background: #554422; } /* Amarillo mate */
        .dot-g { background: #225522; } /* Verde mate */
        
        .terminal-title { font-family: var(--font-code); font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px;}
        .close-btn { color: var(--text-muted); background: transparent; border: none; font-size: 1.2rem; cursor: pointer; font-family: var(--font-sans);}
        .close-btn:hover { color: #fff; }

        /* Split Screen Body */
        .terminal-body { display: grid; grid-template-columns: 40% 60%; flex-grow: 1; overflow: hidden; }

        /* Panel Izquierdo: Entradas */
        .panel-inputs {
            border-right: var(--hairline); padding: 2rem; overflow-y: auto;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .input-group { display: flex; flex-direction: column; gap: 1rem; }
        .input-title { font-family: var(--font-code); font-size: 0.75rem; color: #fff; text-transform: uppercase; letter-spacing: 1px; border-bottom: var(--hairline); padding-bottom: 0.5rem;}
        
        .radio-label {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            font-family: var(--font-code); font-size: 0.8rem; color: var(--text-muted);
            transition: color 0.2s;
        }
        .radio-label:hover { color: #fff; }
        /* Radio Box Cuadrado (Crudo) */
        .radio-label input[type="radio"] { appearance: none; width: 14px; height: 14px; border: 1px solid var(--text-muted); background: transparent; cursor: pointer;}
        .radio-label input[type="radio"]:checked { background: var(--accent-neon); border-color: var(--accent-neon); }
        .radio-label input[type="radio"]:checked + span { color: #fff; font-weight: 600;}

        /* Panel Derecho: Consola Output */
        .panel-console {
            background: var(--bg-terminal); padding: 2rem; overflow-y: auto;
            font-family: var(--font-code); font-size: 0.85rem; color: var(--accent-neon);
            line-height: 1.6; display: flex; flex-direction: column;
        }
        .console-line { margin-bottom: 0.5rem; opacity: 0; animation: typeLine 0.1s forwards; }
        .console-cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent-neon); animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 5px;}
        
        @keyframes typeLine { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Footer de Ventana (Cierre de Venta) */
        .terminal-footer {
            border-top: var(--hairline); padding: 1rem 2rem; background: #0A0A0C;
            display: flex; justify-content: flex-end;
        }
        .btn-transmit {
            background: #fff; color: #000; border: none; padding: 0.8rem 1.5rem;
            font-family: var(--font-code); font-size: 0.75rem; text-transform: uppercase;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-transmit:hover { background: var(--accent-neon); }

        /* ─── 06. RESPONSIVE MÓVIL (MATEMÁTICA EXACTA) ─── */
        @media (max-width: 900px) {
            .navbar-links { display: none; } /* Ocultar links en móvil para limpiar UI */
            .hero-giant-text { font-size: 11.5vw; } 
            .giant-transparent-logo { width: 35vw; }
            .telemetry-data { font-size: 0.55rem; padding: 0 1rem; }
            
            /* Modal a 1 columna en móvil */
            .terminal-body { grid-template-columns: 1fr; grid-template-rows: auto 200px; overflow-y: auto;}
            .panel-inputs { border-right: none; border-bottom: var(--hairline); padding: 1.5rem; }
            .panel-console { padding: 1.5rem; font-size: 0.75rem; }
            .terminal-window { height: 90vh; max-height: 90vh; }
        }
    </style>
</head>
<body>

    <div class="ambient-canvas">
        <div class="stars-container">
            <div class="star-layer stars-1"></div>
            <div class="star-layer stars-2"></div>
        </div>
    </div>

    <nav class="top-navbar">
        <a href="#" class="navbar-brand">DISK_CREATIVO</a>
        <div class="navbar-links">
            <a href="#" class="nav-link">// LA_BASE</a>
            <a href="#" class="nav-link">// SISTEMAS</a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="hero-sandwich">
            <h1 class="hero-giant-text">
                <div>
                    <span class="z-back solid-purple-letter">D</span><span class="z-front solid-white-letter">I</span><span class="z-back solid-purple-letter">S</span><span class="z-front solid-purple-letter">K</span>
                </div>
                <div>
                    <span class="z-front solid-purple-letter">C</span><span class="z-back solid-purple-letter">R</span><span class="z-front solid-white-letter">E</span><span class="z-back solid-purple-letter">A</span><span class="z-front solid-white-letter overlap-t">T</span><span class="z-back solid-purple-letter overlap-i-behind">I</span><span class="z-back solid-purple-letter">V</span><span class="z-front solid-purple-letter">O</span>
                </div>
            </h1>
            
            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/ea71a2a658c405870ed1a44f792c411025c2e937/DIQC/1785538967768.png" alt="Render 3D Disk" class="giant-transparent-logo">
            
            <div class="telemetry-data">
                LOC: 8.9824° N, 79.5199° W // PANAMÁ CITY // ESTADO: <span>LISTO PARA DESPLEGAR</span>
            </div>

            <button class="btn-mechanical" id="btnOpenTerminal">[ INICIAR_DESPLIEGUE ]</button>
        </div>
    </section>

    <div class="modal-overlay" id="terminalOverlay">
        <div class="terminal-window">
            
            <div class="terminal-header">
                <div class="window-controls">
                    <div class="win-dot dot-r"></div>
                    <div class="win-dot dot-y"></div>
                    <div class="win-dot dot-g"></div>
                </div>
                <div class="terminal-title">setup_disk_creativo.exe</div>
                <button class="close-btn" id="btnCloseTerminal">×</button>
            </div>

            <div class="terminal-body">
                
                <div class="panel-inputs">
                    <div class="input-group">
                        <div class="input-title">1. ARQUITECTURA BASE</div>
                        <label class="radio-label">
                            <input type="radio" name="arq" value="Landing Page Ágil"> <span>Landing Page Ágil</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="arq" value="E-Commerce Transaccional"> <span>E-Commerce Transaccional</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="arq" value="Sistema Web Custom (Air-Gapped)"> <span>Sistema Web Custom</span>
                        </label>
                    </div>

                    <div class="input-group">
                        <div class="input-title">2. IDENTIDAD CORPORATIVA</div>
                        <label class="radio-label">
                            <input type="radio" name="id" value="Tengo Branding"> <span>Manual de Marca Existente</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="id" value="Requiere Rebranding"> <span>Rebranding Absoluto Requerido</span>
                        </label>
                    </div>
                </div>

                <div class="panel-console" id="consoleOutput">
                    <div class="console-line">> Inicializando protocolo de lectura... [OK]</div>
                    <div class="console-line">> Esperando parámetros del usuario...</div>
                    <div id="cursorAnchor"><span class="console-cursor"></span></div>
                </div>
            </div>

            <div class="terminal-footer">
                <button class="btn-transmit" id="btnTransmit">Transmitir Carga -> WA</button>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ─── CONTROLADOR DE VENTANA MODAL ───
            const btnOpen = document.getElementById('btnOpenTerminal');
            const btnClose = document.getElementById('btnCloseTerminal');
            const overlay = document.getElementById('terminalOverlay');

            btnOpen.addEventListener('click', () => {
                overlay.classList.add('is-active');
            });

            btnClose.addEventListener('click', () => {
                overlay.classList.remove('is-active');
            });

            // ─── MOTOR DE CONSOLA (LIVE OUTPUT) ───
            const radios = document.querySelectorAll('input[type="radio"]');
            const consoleOutput = document.getElementById('consoleOutput');
            const cursorAnchor = document.getElementById('cursorAnchor');

            // Función para escribir en la terminal
            function printToConsole(text) {
                const newLine = document.createElement('div');
                newLine.className = 'console-line';
                newLine.innerText = `> ${text}`;
                consoleOutput.insertBefore(newLine, cursorAnchor);
                consoleOutput.scrollTop = consoleOutput.scrollHeight; // Auto-scroll
            }

            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const group = e.target.name === 'arq' ? 'ARQUITECTURA' : 'IDENTIDAD';
                    const value = e.target.value;
                    printToConsole(`Seteando parámetro [${group}] a: "${value}"`);
                    printToConsole(`Cargando dependencias de ${value}... [OK]`);
                });
            });

            // ─── MOTOR DE EXPORTACIÓN A WHATSAPP ───
            const btnTransmit = document.getElementById('btnTransmit');
            const waNumber = "50768529324"; 

            btnTransmit.addEventListener('click', () => {
                const selectedArq = document.querySelector('input[name="arq"]:checked');
                const selectedId = document.querySelector('input[name="id"]:checked');

                if(!selectedArq || !selectedId) {
                    printToConsole("ERR: Faltan parámetros. Seleccione Arquitectura e Identidad.");
                    return;
                }

                printToConsole("Compilando solicitud de infraestructura...");
                
                // Retraso dramático para efecto técnico
                setTimeout(() => {
                    const msg = `Hola Disk Creativo. He iniciado la configuración de mi proyecto.\n\n*Parámetros del Sistema:*\n- Arquitectura: ${selectedArq.value}\n- Identidad: ${selectedId.value}\n\nRequiero conexión para evaluar el despliegue.`;
                    const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
                    printToConsole("Redirigiendo a nodo de comunicaciones (WhatsApp)...");
                    
                    setTimeout(() => {
                        window.open(waUrl, '_blank');
                    }, 800);

                }, 600);
            });
        });
    </script>
</body>
</html>
