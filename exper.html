<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Hero Fixed Sandbox</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@800&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #050505;
            --brand-purple: #6B00FF;
            --accent-neon: #00FF66;
            --text-main: #EAE9E4; 
            --text-muted: rgba(234, 233, 228, 0.6);
            --hairline: 1px solid rgba(255, 255, 255, 0.1);
            
            /* NUEVA FUENTE DISPLAY: 'Unbounded' (Alternativa: 'Syne') */
            --font-display: 'Unbounded', sans-serif;
            --font-sans: 'Inter', sans-serif;
            --font-code: 'Courier New', Courier, monospace;
        }

        html, body { overflow-x: clip !important; max-width: 100%; width: 100%; }
        html { scroll-behavior: smooth; height: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            color: var(--text-main); font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased; background-color: var(--bg-primary);
            position: relative; min-height: 100%;
        }

        /* ─── 01. LIENZO ESPACIAL ─── */
        .ambient-canvas {
            position: fixed; top: -5vh; left: 0; right: 0; 
            width: 100vw; height: 110vh; 
            background-image: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/27a5f1ff96e9d1b4c4a205126ccbcba5a9b57582/DIQC/file_000000006e7481fd87c722d8d1370ae9.png');
            background-position: center center; background-size: cover; background-repeat: no-repeat;
            background-color: var(--bg-primary); background-attachment: fixed;
            z-index: -3; filter: brightness(0.9) saturate(1.1);
        }

        /* ─── 02. ESTRELLAS FUGACES ─── */
        .stars-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; pointer-events: none; }
        .stars-1 {
            position: absolute; width: 1px; height: 1px; background: transparent;
            box-shadow: 15vw 20vh #FFF, 40vw 60vh #FFF, 80vw 15vh #FFF, 25vw 85vh #FFF, 60vw 30vh #FFF, 90vw 70vh #FFF, 10vw 45vh #FFF, 70vw 80vh #FFF;
            animation: twinkle 40s infinite alternate ease-in-out;
        }
        .stars-2 {
            position: absolute; width: 2px; height: 2px; background: transparent;
            box-shadow: 35vw 10vh #FFF, 85vw 50vh #FFF, 50vw 85vh #FFF, 15vw 70vh #FFF, 75vw 25vh #FFF;
            animation: twinkle 60s infinite alternate-reverse ease-in-out;
        }
        @keyframes twinkle { 0% { opacity: 0.1; } 100% { opacity: 0.4; } }

        /* ─── 03. NAVBAR PREMIUM MULTI-DISPOSITIVO ─── */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: var(--hairline); display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: 2000; transition: transform 0.3s ease;
        }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-sans); font-size: 1rem; font-weight: 600; color: #fff; letter-spacing: 2px; text-decoration: none; text-transform: uppercase; }
        .brand-icon { height: 22px; width: auto; object-fit: contain; }
        
        .navbar-links { display: flex; gap: 3rem; align-items: center; }
        .nav-link { color: var(--text-main); text-decoration: none; font-family: var(--font-sans); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-link:hover { color: var(--brand-purple); }
        
        .nav-btn-wa {
            background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 400; text-decoration: none; font-family: var(--font-sans); font-size: 0.75rem; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s; text-transform: uppercase;
        }
        .nav-btn-wa svg { width: 14px; height: 14px; fill: currentColor; }
        .nav-btn-wa:hover { background: #25D366; border-color: #25D366; color: #000; }

        /* ─── 04. HERO SECTION ─── */
        .hero-section { position: relative; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2vw; padding-top: 70px; z-index: 10; }
        .hero-sandwich { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 100%; z-index: 10; }
        
        /* TIPOGRAFÍA ANCHA 'UNBOUNDED' */
        .hero-giant-text {
            font-family: var(--font-display); 
            font-size: clamp(2.5rem, 11vw, 16rem); /* Ajustado para fuente ancha */
            font-weight: 900;
            line-height: 0.9; text-align: center; margin: 0; text-transform: uppercase;
            display: flex; flex-direction: column; gap: clamp(1.5rem, 6vh, 5rem); 
            letter-spacing: -3px; width: 100%;
        }
        .hero-giant-text div { display: flex; justify-content: center; align-items: center; gap: 0.8vw; flex-wrap: wrap; }

        .solid-gray-letter {
            color: #B8B8B8; display: inline-block; position: relative;
            text-shadow: 0px 1px 0px #909090, 0px 2px 0px #858585, 0px 3px 0px #7A7A7A, 0px 4px 0px #707070, 0px 5px 0px #656565, 0px 6px 0px #4A4A4A, 0px 7px 0px #404040, 0px 15px 15px rgba(0, 0, 0, 0.4), 0px 30px 25px rgba(0, 0, 0, 0.6);
        }
        
        .liquid-glass-letter {
            font-family: var(--font-display); display: inline-block;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(0, 240, 255, 0.1) 20%, transparent 40%, transparent 60%, rgba(255, 0, 60, 0.1) 80%, rgba(255, 255, 255, 0.3) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.05); -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 75px 25px rgba(0, 0, 0, 0.45)); backdrop-filter: blur(2px) saturate(110%); -webkit-backdrop-filter: blur(2px) saturate(110%);
            position: relative; 
        }

        .z-back { z-index: 1 !important; position: relative; }
        .z-front { z-index: 10 !important; position: relative; }
        .overlap-t { z-index: 25 !important; position: relative; }
        .overlap-i-behind { z-index: 1 !important; position: relative; margin-left: -0.08em; }

        /* CORRECCIÓN VERTICAL PC: top: 32% eleva el disco a la parte superior */
        .giant-transparent-logo {
            position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); 
            width: clamp(120px, 16vw, 280px); z-index: 5; pointer-events: none;
            filter: drop-shadow(0px 20px 15px rgba(0, 0, 0, 0.95));
            animation: mechanicalFloat 10s ease-in-out infinite; 
        }

        @keyframes mechanicalFloat { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -52%); } }
        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .float-anim { display: inline-block; animation: floatLetter 9s ease-in-out infinite; }
        .delay-1 { animation-delay: 0s; } .delay-2 { animation-delay: 1.5s; } .delay-3 { animation-delay: 3s; } .delay-4 { animation-delay: 4.5s; } .delay-5 { animation-delay: 6s; } .delay-6 { animation-delay: 7.5s; }

        .hero-reproductor-btn {
            display: block; margin-top: 4rem; width: 90%; max-width: 400px;
            position: relative; z-index: 20; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.8));
        }
        .hero-reproductor-btn img { width: 100%; height: auto; display: block; }
        .hero-reproductor-btn:hover { transform: translateY(4px); filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.9)); }
        .hero-reproductor-btn:active { transform: translateY(10px); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.95)); }

        .analog-cut {
            width: 100%; height: 6vh; min-height: 40px; display: block;
            background-image: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/0bc1cbae60e585237d38e03ea2fa9c12a7231d0a/DIQC/IMG_20260723_145416.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            position: relative; z-index: 25; border-top: var(--hairline); border-bottom: var(--hairline);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9), 0 10px 40px rgba(0,0,0,0.9);
        }

        /* ─── RESPONSIVE MÓVIL (CORREGIDO DE RAÍZ) ─── */
        @media (max-width: 900px) {
            .top-navbar { padding: 0 4vw; height: 60px; }
            .navbar-brand { font-size: 0.75rem; gap: 4px; }
            .navbar-brand span { display: none; } 
            .brand-icon { height: 18px; }
            
            .navbar-links { display: flex; gap: 1rem; } 
            .nav-link { font-size: 0.6rem; }
            .nav-btn-wa { padding: 0.4rem 0.8rem; font-size: 0.6rem; gap: 4px;}
            .nav-btn-wa svg { width: 12px; height: 12px; }
            
            .hero-giant-text { font-size: 13.5vw; gap: 2.5vh; line-height: 0.95;} 
            
            /* FIX MÓVIL: top: 26% eleva el CD por encima de 'CREATIVO', liberando la 'A' por completo */
            .giant-transparent-logo { 
                width: clamp(90px, 28vw, 140px); 
                top: 26%; 
            }
            .hero-reproductor-btn { width: 85%; margin-top: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-canvas" id="parallaxBg"></div>

    <div class="stars-container">
        <div class="stars-1"></div>
        <div class="stars-2"></div>
    </div>

    <nav class="top-navbar" id="topNavbar">
        <a href="#inicio" class="navbar-brand">
            DISK<span>.CREATIVO</span>
            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/ea71a2a658c405870ed1a44f792c411025c2e937/DIQC/1785538967768.png" alt="Disk Icon" class="brand-icon">
        </a>
        <div class="navbar-links">
            <a href="#inicio" class="nav-link">Inicio</a>
            <a href="dex.html" class="nav-link">Construye</a>
            <a href="https://wa.me/50768529324" target="_blank" class="nav-btn-wa">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
                WhatsApp
            </a>
        </div>
    </nav>

    <section class="hero-section" id="inicio">
        <div class="hero-sandwich">
            <h1 class="hero-giant-text">
                <div>
                    <span class="z-back solid-gray-letter delay-1">D</span><span class="z-front liquid-glass-letter float-anim delay-1">I</span><span class="z-back solid-gray-letter">S</span><span class="z-front solid-gray-letter float-anim delay-2">K</span>
                </div>
                <div>
                    <span class="z-front solid-gray-letter float-anim delay-3">C</span><span class="z-back solid-gray-letter delay-4">R</span><span class="z-front liquid-glass-letter float-anim delay-4">E</span><span class="z-back solid-gray-letter delay-5">A</span><span class="z-front liquid-glass-letter overlap-t float-anim delay-5">T</span><span class="z-back solid-gray-letter overlap-i-behind">I</span><span class="z-back solid-gray-letter delay-6">V</span><span class="z-front solid-gray-letter float-anim delay-6">O</span>
                </div>
            </h1>
            
            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/93b5261029d61bf88eee569ffe36701e636d2899/DIQC/discoC.png" alt="Disk Creativo Render 3D" class="giant-transparent-logo" id="dynamic-logo">
            
            <a href="dex.html" class="hero-reproductor-btn">
                <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/f8e0514422bcda8f54aaf7aeb2dfda902f312d0c/DIQC/file_00000000f0e4822fbe46c8a8053e88e8.png" alt="Reproductor Configuración">
            </a>
        </div>
    </section>

    <div class="analog-cut"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dynamicLogo = document.getElementById('dynamic-logo');
            const topNavbar = document.getElementById('topNavbar');
            
            window.addEventListener('scroll', () => {
                const scrolled = window.scrollY;
                if(scrolled > 50) topNavbar.style.transform = 'translateY(-100%)';
                else topNavbar.style.transform = 'translateY(0)';
            }, { passive: true });

            const heroContainer = document.getElementById('inicio');
            if(heroContainer && dynamicLogo && window.innerWidth > 768) {
                heroContainer.addEventListener('mousemove', (e) => {
                    const rect = heroContainer.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    dynamicLogo.style.transform = `translate(calc(-50% + ${x * -40}px), calc(-50% + ${y * -40}px))`;
                });
                heroContainer.addEventListener('mouseleave', () => { dynamicLogo.style.transform = 'translate(-50%, -50%)'; });
            }
        });
    </script>
</body>
</html>
