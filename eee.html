<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Infraestructura Digital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #050505;
            --brand-purple: #6B00FF;
            --accent-neon: #00FF66;
            --text-main: #EAE9E4;
            --text-muted: rgba(234, 233, 228, 0.6);
            --hairline: 1px solid rgba(255, 255, 255, 0.15);

            --font-display: 'Anton', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        html, body {
            overflow-x: clip !important;
            max-width: 100%; width: 100%;
        }

        html { scroll-behavior: smooth; height: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            color: var(--text-main);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-primary);
            position: relative; min-height: 100%;
        }

        a { color: inherit; }
        img { max-width: 100%; display: block; }

        /* Foco visible accesible en toda la página */
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent-neon);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* ─── LIENZO DEL ESTUDIO EN EL VACÍO ─── */
        .ambient-canvas {
            position: fixed; top: -5vh; left: 0; right: 0;
            width: 100vw; height: 110vh;
            background-image: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/c97611b6a556fa85d00e302313fd0dbfab2e3406/DIQC/file_00000000c60481f7b7f5519059d41ed9.png');
            background-position: center center; background-size: cover; background-repeat: no-repeat;
            background-color: var(--bg-primary);
            background-attachment: fixed;
            z-index: -3; filter: brightness(0.9) saturate(1.1);
        }

        /* ─── MICRO-ESTRELLAS ─── */
        .stars-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2; pointer-events: none;
        }

        .stars-1 {
            position: absolute; width: 1px; height: 1px; background: transparent;
            box-shadow: 15vw 20vh #FFF, 40vw 60vh #FFF, 80vw 15vh #FFF, 25vw 85vh #FFF, 60vw 30vh #FFF, 90vw 70vh #FFF, 10vw 45vh #FFF, 70vw 80vh #FFF;
            animation: twinkle 40s infinite alternate ease-in-out;
        }
        .stars-2 {
            position: absolute; width: 2px; height: 2px; background: transparent;
            box-shadow: 35vw 10vh #FFF, 85vw 50vh #FFF, 50vw 85vh #FFF, 15vw 70vh #FFF, 75vw 25vh #FFF;
            animation: twinkle 60s infinite alternate-reverse ease-in-out;
        }

        .stars-static-twinkle {
            position: absolute; width: 1px; height: 1px; background: transparent;
            box-shadow:
                5vw 10vh #AAA, 10vw 30vh #AAA, 3vw 60vh #AAA, 12vw 80vh #AAA, 7vw 90vh #AAA, 2vw 20vh #AAA,
                95vw 10vh #AAA, 90vw 30vh #AAA, 97vw 60vh #AAA, 88vw 80vh #AAA, 93vw 90vh #AAA, 98vw 20vh #AAA,
                30vw 5vh #AAA, 70vw 95vh #AAA;
            animation: breathing 15s infinite alternate ease-in-out;
        }

        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.98); } 100% { opacity: 0.4; transform: scale(1.02); } }
        @keyframes breathing { 0% { opacity: 0.1; } 100% { opacity: 0.5; } }

        /* ─── NAVBAR SUPERIOR ─── */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.5);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: var(--hairline);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: 2000; transition: all 0.3s ease;
        }

        .navbar-brand {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-sans); font-size: 1rem; font-weight: 600;
            color: #fff; letter-spacing: 2px; text-decoration: none; text-transform: uppercase;
        }
        .brand-icon { height: 22px; width: auto; object-fit: contain; }

        .navbar-links { display: flex; gap: 3rem; align-items: center; }
        .nav-link {
            color: var(--text-main); text-decoration: none; font-family: var(--font-sans);
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s;
            background: none; border: none; cursor: pointer; padding: 0;
        }
        .nav-link:hover { color: var(--brand-purple); }

        .nav-btn-wa {
            background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 400;
            text-decoration: none; font-family: var(--font-sans); font-size: 0.75rem; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s; text-transform: uppercase;
        }
        .nav-btn-wa svg { width: 14px; height: 14px; fill: currentColor; }
        .nav-btn-wa:hover { background: #25D366; border-color: #25D366; color: #000; }

        /* ─── SECCIÓN 1: HERO ─── */
        .hero-section {
            position: relative; height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2vw;
            padding-top: 70px; z-index: 10;
        }

        .hero-sandwich { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 100%; z-index: 10; }

        .hero-giant-text {
            font-family: var(--font-display); font-size: clamp(3rem, 15vw, 22rem);
            line-height: 0.85; text-align: center; margin: 0; text-transform: uppercase;
            display: flex; flex-direction: column; gap: 1vh; letter-spacing: -2px;
            width: 100%;
        }
        .hero-giant-text div { display: flex; justify-content: center; align-items: center; gap: 0.8vw; flex-wrap: wrap; }

        .solid-purple-letter {
            color: var(--brand-purple); display: inline-block; position: relative;
            text-shadow: 0px 1px 0px #4A00B3, 0px 2px 0px #4A00B3, 0px 3px 0px #4A00B3, 0px 4px 0px #4A00B3, 0px 5px 0px #4A00B3, 0px 6px 0px #35008B, 0px 7px 0px #35008B, 0px 15px 15px rgba(0, 0, 0, 0.2), 0px 75px 25px rgba(0, 0, 0, 0.45);
        }
        .liquid-glass-letter {
            font-family: var(--font-display); display: inline-block;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(0, 240, 255, 0.1) 20%, rgba(255, 255, 255, 0.0) 40%, rgba(255, 255, 255, 0.0) 60%, rgba(255, 0, 60, 0.1) 80%, rgba(255, 255, 255, 0.3) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.05); -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0px 75px 25px rgba(0, 0, 0, 0.45));
            backdrop-filter: blur(2px) saturate(110%); -webkit-backdrop-filter: blur(2px) saturate(110%);
            position: relative;
        }

        .z-back { z-index: 1; position: relative; }
        .z-front { z-index: 10; position: relative; }
        .overlap-t { z-index: 25 !important; position: relative; }
        .overlap-i-behind { z-index: 15 !important; position: relative; margin-left: -0.08em; }

        .giant-transparent-logo {
            position: absolute;
            top: 55%; left: 49%;
            transform: translate(-50%, -50%);
            width: clamp(150px, 24vw, 420px);
            z-index: 5; pointer-events: none;
            filter: drop-shadow(0px 60px 25px rgba(0, 0, 0, 0.7));
            animation: floatLogo 8s ease-in-out infinite;
        }

        @keyframes floatLogo { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -54%) rotate(2deg); } }
        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .float-anim { display: inline-block; animation: floatLetter 9s ease-in-out infinite; }
        .delay-1 { animation-delay: 0s; } .delay-2 { animation-delay: 1.5s; } .delay-3 { animation-delay: 3s; } .delay-4 { animation-delay: 4.5s; } .delay-5 { animation-delay: 6s; } .delay-6 { animation-delay: 7.5s; }

        .hero-tagline {
            font-family: var(--font-sans); font-size: clamp(0.85rem, 1.2vw, 1.1rem);
            color: rgba(255,255,255,0.8); margin-top: 2rem; position: relative; z-index: 20;
            text-transform: uppercase; letter-spacing: 1.5px; font-weight: 300;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); text-align: center;
        }

        /* ─── CINTA ANALÓGICA ─── */
        .analog-cut {
            width: 100%; height: 6vh; min-height: 40px;
            background-image: url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/0bc1cbae60e585237d38e03ea2fa9c12a7231d0a/DIQC/IMG_20260723_145416.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            position: relative; z-index: 25;
            border-top: var(--hairline); border-bottom: var(--hairline);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9), 0 10px 40px rgba(0,0,0,0.9);
        }

        /* ─── FONDO EDITORIAL ─── */
        .engineering-bg {
            background-color: var(--bg-primary); position: relative; z-index: 20;
            width: 100%; overflow: hidden;
        }

        /* ─── SECCIÓN 2: IDENTIDAD ─── */
        .identity-section { padding: 6rem 4vw; max-width: 1600px; margin: 0 auto; width: 100%; }

        .editorial-frame {
            border: var(--hairline); display: grid; grid-template-columns: 60% 40%;
            background: rgba(255,255,255,0.01); width: 100%;
        }

        .identity-text {
            padding: 5rem 4rem; display: flex; flex-direction: column;
            border-right: var(--hairline);
        }

        .sys-header { font-family: var(--font-sans); color: rgba(255,255,255,0.4); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 3px; font-weight: 300; margin-bottom: 2rem;}

        .manifesto-blocks { display: flex; flex-direction: column; border-top: var(--hairline); margin-top: 1rem; }

        .manifesto-block { padding: 3rem 0; border-bottom: var(--hairline); display: flex; flex-direction: column; gap: 1.5rem; }
        .manifesto-block:last-child { border-bottom: none; padding-bottom: 0; }

        .manifesto-title {
            font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600;
            color: var(--text-main); text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 15px; margin: 0;
        }
        .manifesto-title span { color: var(--accent-neon); font-family: var(--font-sans); font-weight: 400;}

        .manifesto-desc {
            font-family: var(--font-serif); font-size: clamp(1.1rem, 1.5vw, 1.35rem);
            line-height: 1.6; color: var(--text-muted); font-weight: 400; margin: 0;
        }
        .manifesto-desc strong { color: var(--text-main); font-style: italic; font-weight: 400; }

        .identity-mockup-container { padding: 3rem; display: flex; align-items: flex-start; justify-content: center; }
        .identity-mockup {
            position: sticky; top: 120px;
            display: flex; justify-content: center; align-items: center; width: 100%;
        }
        .playground-img {
            width: 100%; max-width: 500px; height: auto; object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
            animation: floatEditorial 12s ease-in-out infinite;
        }
        @keyframes floatEditorial { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.02); } }

        /* ─── SECCIÓN 3: PROYECTOS (DESPLEGABLE B2B) ─── */
        .projects-section { padding: 4rem 4vw; padding-bottom: 8rem; max-width: 1600px; margin: 0 auto; width: 100%; }

        .projects-header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 3rem; text-align: center; align-items: center;}
        .projects-title { font-family: var(--font-display); font-size: clamp(3rem, 8vw, 8rem); line-height: 0.9; text-transform: uppercase; margin: 0; letter-spacing: -1px;}
        .projects-subtitle { font-family: var(--font-serif); font-size: 1.2rem; color: var(--text-muted); font-style: italic;}

        .btn-toggle-projects {
            background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 1rem 2rem; border-radius: 50px; font-weight: 600; cursor: pointer;
            font-family: var(--font-sans); font-size: 0.85rem; letter-spacing: 2px;
            transition: all 0.3s; text-transform: uppercase; margin-top: 1rem;
        }
        .btn-toggle-projects:hover { background: var(--brand-purple); border-color: var(--brand-purple); color: #fff; box-shadow: 0 10px 20px rgba(107, 0, 255, 0.3); }
        .btn-toggle-projects[aria-expanded="true"] { background: var(--accent-neon); border-color: var(--accent-neon); color: #000; }

        .grid-editorial {
            display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2.5rem;
            perspective: 1200px; width: 100%; margin-top: 3rem; animation: fadeIn 0.5s ease;
        }
        .grid-editorial.is-visible { display: grid; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-wrapper { width: 100%; height: 450px; perspective: 1200px; }

        .card-editorial {
            width: 100%; height: 100%; position: relative;
            background: transparent; border: var(--hairline);
            transform-style: preserve-3d;
            display: flex; flex-direction: column; text-decoration: none; cursor: pointer;
            transition: box-shadow 0.3s, background 0.3s;
        }

        .card-thumb {
            width: 100%; height: 220px; transform: translate3d(0,0,20px);
            position: relative; overflow: hidden; border-bottom: var(--hairline); pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(107,0,255,0.25), rgba(0,0,0,0.6));
        }
        .card-thumb-mark {
            font-family: var(--font-display); font-size: 2.5rem; color: rgba(255,255,255,0.25);
            letter-spacing: 2px; transition: color 0.4s;
        }

        .card-content { padding: 1.5rem 2rem; transform: translate3d(0, 0, 30px); display: flex; flex-direction: column; flex-grow: 1; pointer-events: none;}
        .card-badge { font-family: var(--font-sans); font-size: 0.65rem; color: var(--text-main); opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.8rem; display: block;}
        .card-title { font-family: var(--font-serif); font-size: 1.8rem; color: var(--text-main); line-height: 1.1; margin-bottom: 0.5rem; font-weight: 400;}
        .card-desc { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 300; color: var(--text-muted); line-height: 1.5; }

        .card-bottom {
            padding: 1rem 2rem; border-top: var(--hairline);
            transform: translate3d(0, 0, 40px); display: flex; justify-content: space-between; align-items: center; pointer-events: none;
        }
        .card-exe { font-family: var(--font-sans); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-main); opacity: 0.4; transition: opacity 0.3s; font-weight: 600;}

        .card-editorial.is-active { box-shadow: 10px 20px 30px rgba(0,0,0,0.8); background: rgba(255,255,255,0.02); }
        .card-editorial.is-active .card-thumb-mark { color: var(--accent-neon); }
        .card-editorial.is-active .card-exe { opacity: 1; color: var(--accent-neon); }

        /* ─── FOOTER EDITORIAL ─── */
        .site-footer {
            background-color: var(--bg-primary); border-top: var(--hairline);
            padding: 4rem 4vw 7rem; position: relative; z-index: 20;
        }
        .footer-grid {
            max-width: 1600px; margin: 0 auto;
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 3rem; align-items: end;
        }
        .footer-brand {
            font-family: var(--font-display); font-size: clamp(2rem, 5vw, 4rem);
            color: var(--text-main); text-transform: uppercase; line-height: 1; margin-bottom: 1rem;
        }
        .footer-status {
            font-family: var(--font-sans); font-size: 0.75rem; color: var(--accent-neon);
            letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .footer-status::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-neon);
            box-shadow: 0 0 8px var(--accent-neon);
        }
        .footer-info p {
            font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted);
            line-height: 1.6; margin: 0;
        }
        .footer-links { display: flex; flex-direction: column; gap: 1rem; }
        .footer-link {
            font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-main);
            text-decoration: none; transition: color 0.3s; text-transform: uppercase;
            letter-spacing: 1px; font-weight: 500;
        }
        .footer-link:hover { color: var(--brand-purple); }

        /* ─── DOCK DE CÁMARA (SMART DOCKING) ─── */
        .camera-container {
            position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 650px; z-index: 3000; pointer-events: none;
        }
        .camera-float-wrapper {
            width: 100%; position: relative;
            animation: subtleFloatDock 6s infinite ease-in-out;
        }
        .camera-img { width: 100%; height: auto; object-fit: contain; display: block; pointer-events: auto; filter: drop-shadow(0px 10px 25px rgba(0,0,0,0.9)); transform-origin: center bottom; }

        @keyframes subtleFloatDock { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }

        .hitbox {
            position: absolute; pointer-events: auto; bottom: 25%; height: 40%; z-index: 3010;
            cursor: pointer; outline: none; background: transparent; border: none;
        }
        .hitbox-inicio { left: 16%; width: 15%; }
        .hitbox-identidad { left: 34%; width: 15%; }
        .hitbox-proyectos { left: 52%; width: 15%; }
        .hitbox-contacto { left: 70%; width: 15%; }

        /* ─── RESPETO A REDUCED MOTION ─── */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .stars-1, .stars-2, .stars-static-twinkle,
            .giant-transparent-logo, .float-anim, .playground-img,
            .camera-float-wrapper, .grid-editorial {
                animation: none !important;
            }
        }

        /* ─── RESPONSIVE MÓVIL UNIVERSAL ─── */
        @media (max-width: 900px) {
            .top-navbar { padding: 0 4vw; height: 60px; }
            .navbar-brand { font-size: 0.8rem; gap: 6px; }
            .navbar-brand span { display: none; }
            .brand-icon { height: 18px; }

            .navbar-links
