<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Inicializar Proyecto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Variables Core */
            --bg-primary: #050505;
            --bg-secondary: #0A0A0C;
            --bg-panel: #111111;
            --brand-purple: #6B00FF;
            --accent-neon: #00FF66;
            --text-main: #EAE9E4; 
            --text-muted: rgba(234, 233, 228, 0.5);
            --hairline: 1px solid rgba(255, 255, 255, 0.1);
            --hairline-focus: 1px solid var(--accent-neon);
            
            /* Tipografía */
            --font-display: 'Anton', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --font-code: 'Courier New', Courier, monospace;
        }

        html, body { overflow-x: hidden; max-width: 100%; width: 100%; scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            color: var(--text-main); font-family: var(--font-sans); 
            -webkit-font-smoothing: antialiased; background-color: var(--bg-primary); 
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ─── FONDOS Y ATMÓSFERA ─── */
        .ambient-canvas {
            position: fixed; top: -5vh; left: 0; width: 100vw; height: 110vh; 
            background: var(--bg-primary) url('https://raw.githubusercontent.com/tecnotradepty/portafoliojd/27a5f1ff96e9d1b4c4a205126ccbcba5a9b57582/DIQC/file_000000006e7481fd87c722d8d1370ae9.png') center/cover no-repeat fixed;
            z-index: -3; filter: brightness(0.9) saturate(1.1);
        }
        
        .minimal-stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; pointer-events: none; }
        .minimal-stars::after {
            content: ""; position: absolute; width: 2px; height: 2px; background: transparent;
            box-shadow: 15vw 10vh rgba(255,255,255,0.5), 85vw 25vh rgba(255,255,255,0.3), 45vw 40vh rgba(255,255,255,0.6), 10vw 60vh rgba(255,255,255,0.4), 75vw 70vh rgba(255,255,255,0.5), 90vw 15vh rgba(255,255,255,0.2), 25vw 85vh rgba(255,255,255,0.4), 65vw 90vh rgba(255,255,255,0.3), 5vw 35vh rgba(255,255,255,0.5), 50vw 15vh rgba(255,255,255,0.2);
            animation: slowBreathe 8s infinite alternate ease-in-out;
        }
        @keyframes slowBreathe { 0% { opacity: 0.4; } 100% { opacity: 0.8; } }

        /* ─── NAVBAR PREMIUM ─── */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: var(--hairline); display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; z-index: 2000; transition: transform 0.3s ease;
        }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #fff; letter-spacing: 2px; text-decoration: none; text-transform: uppercase; }
        .brand-icon { height: 22px; width: auto; object-fit: contain; }
        .navbar-links { display: flex; gap: 3rem; align-items: center; }
        .nav-link { color: var(--text-main); text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-link:hover { color: var(--brand-purple); }

        /* ─── CONTENEDOR DEL FORMULARIO B2B ─── */
        .onboarding-section {
            padding: 120px 4vw 4rem 4vw; /* Espacio para el navbar */
            display: flex; justify-content: center; align-items: flex-start;
            flex-grow: 1; z-index: 10; position: relative;
        }

        .terminal-panel {
            background-color: var(--bg-panel);
            border: var(--hairline);
            width: 100%; max-width: 800px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .panel-header {
            padding: 1.5rem 2rem; border-bottom: var(--hairline);
            background: var(--bg-secondary);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .sys-status { font-family: var(--font-code); color: var(--accent-neon); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;}
        .panel-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; color: var(--text-main); line-height: 1;}

        .panel-body { padding: 3rem 4rem; }
        .intro-text { font-family: var(--font-sans); font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 3rem; font-weight: 300;}

        /* ─── ESTILOS DE FORMULARIO BRUTALISTA ─── */
        .form-group { margin-bottom: 2.5rem; }
        
        .form-label { 
            display: block; font-family: var(--font-code); font-size: 0.8rem; 
            color: var(--brand-purple); text-transform: uppercase; letter-spacing: 1px; 
            margin-bottom: 0.8rem; font-weight: 600;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%; background: transparent; border: none;
            border-bottom: var(--hairline); color: var(--text-main);
            font-family: var(--font-sans); font-size: 1rem; padding: 0.8rem 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            border-radius: 0; outline: none;
        }
        
        .form-input::placeholder, .form-textarea::placeholder { color: rgba(255,255,255,0.2); }
        .form-textarea { resize: vertical; min-height: 80px; }
        
        .form-select { cursor: pointer; color: var(--text-main); appearance: none; background: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 0 center/15px; }
        .form-select option { background: var(--bg-panel); color: var(--text-main); }

        .form-input:focus, .form-textarea:focus, .form-select:focus { 
            border-bottom: var(--hairline-focus); 
            box-shadow: 0 10px 10px -10px rgba(0, 255, 102, 0.1); 
        }

        /* Custom Radio Buttons */
        .radio-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem;}
        .radio-label {
            display: flex; align-items: center; cursor: pointer;
            padding: 1rem; border: var(--hairline); background: rgba(255,255,255,0.02);
            transition: all 0.3s;
        }
        .radio-label:hover { background: rgba(255,255,255,0.05); }
        .radio-input { display: none; }
        .radio-custom {
            width: 16px; height: 16px; border: 1px solid rgba(255,255,255,0.4);
            margin-right: 1rem; display: flex; justify-content: center; align-items: center;
        }
        .radio-input:checked + .radio-custom { border-color: var(--accent-neon); }
        .radio-input:checked + .radio-custom::after {
            content: ""; width: 8px; height: 8px; background: var(--accent-neon);
        }
        .radio-input:checked ~ .radio-text { color: var(--accent-neon); }
        .radio-text { font-family: var(--font-sans); font-size: 0.9rem; font-weight: 300; }

        /* Botón Submit */
        .submit-btn {
            width: 100%; background: var(--text-main); color: var(--bg-primary);
            border: none; padding: 1.2rem; font-family: var(--font-display);
            font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s ease; margin-top: 2rem;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .submit-btn:hover { background: var(--accent-neon); color: #000; box-shadow: 0 10px 30px rgba(0, 255, 102, 0.3); transform: translateY(-3px);}
        .submit-btn:active { transform: translateY(0); }
        .submit-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ─── RESPONSIVE MÓVIL ─── */
        @media (max-width: 900px) {
            .top-navbar { padding: 0 4vw; height: 60px; }
            .navbar-brand { font-size: 0.75rem; gap: 4px; }
            .navbar-brand span { display: none; } 
            .brand-icon { height: 18px; }
            .navbar-links { display: none; } /* Ocultar links en móvil en el form para enfoque */

            .onboarding-section { padding: 100px 4vw 2rem 4vw; }
            .panel-header { padding: 1.2rem; flex-direction: column; align-items: flex-start; gap: 0.5rem;}
            .panel-title { font-size: 1.5rem; }
            .panel-body { padding: 2rem 1.5rem; }
            .intro-text { font-size: 0.85rem; margin-bottom: 2rem; }
            .radio-label { padding: 0.8rem; }
            .radio-text { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-canvas"></div>
    <div class="minimal-stars"></div>

    <nav class="top-navbar">
        <a href="index.html" class="navbar-brand">
            DISK<span>.CREATIVO</span>
            <img src="https://raw.githubusercontent.com/tecnotradepty/portafoliojd/ea71a2a658c405870ed1a44f792c411025c2e937/DIQC/1785538967768.png" alt="Disk Icon" class="brand-icon">
        </a>
        <div class="navbar-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="https://wa.me/50768529324" target="_blank" class="nav-btn-wa">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
                WhatsApp Directo
            </a>
        </div>
    </nav>

    <main class="onboarding-section">
        <div class="terminal-panel">
            <div class="panel-header">
                <h1 class="panel-title">Init_Project</h1>
                <span class="sys-status">SYS // RECEPCIÓN DE DATOS</span>
            </div>
            
            <div class="panel-body">
                <p class="intro-text">
                    La ingeniería requiere contexto. Completa este manifiesto técnico para que podamos evaluar la viabilidad, la arquitectura requerida y los recursos a desplegar en tu empresa.
                </p>

                <form id="diskForm" onsubmit="enviarWhatsApp(event)">
                    
                    <div class="form-group">
                        <label class="form-label">01. Nodo Emisor (Tu Nombre)</label>
                        <input type="text" id="nombre" class="form-input" placeholder="Ej: Jonathan O..." required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="form-label">02. Entidad Comercial (Empresa / Marca)</label>
                        <input type="text" id="empresa" class="form-input" placeholder="Ej: RED Casco Antiguo / Tattoo Shop" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="form-label">03. Estado de Infraestructura Actual</label>
                        <div class="radio-grid">
                            <label class="radio-label">
                                <input type="radio" name="infraestructura" value="Cero absoluto. Es una idea nueva." class="radio-input" required>
                                <div class="radio-custom"></div>
                                <span class="radio-text">Cero absoluto. Es una idea o negocio nuevo.</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="infraestructura" value="Solo redes sociales operando." class="radio-input">
                                <div class="radio-custom"></div>
                                <span class="radio-text">Solo redes sociales (IG/TikTok) operando.</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="infraestructura" value="Tenemos web pero está obsoleta o es genérica." class="radio-input">
                                <div class="radio-custom"></div>
                                <span class="radio-text">Tenemos sitio web, pero está obsoleto o genérico.</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="infraestructura" value="Sistema operativo pero necesitamos escalar." class="radio-input">
                                <div class="radio-custom"></div>
                                <span class="radio-text">Ecosistema operando, pero necesitamos escalar/rediseñar.</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">04. Arquitectura Requerida (Servicio principal)</label>
                        <select id="servicio" class="form-select" required>
                            <option value="" disabled selected>Selecciona un módulo de despliegue...</option>
                            <option value="Landing Page Transaccional (DIR_01)">Landing Page Transaccional (Captación/Ventas)</option>
                            <option value="E-commerce de Alto Rendimiento">E-commerce de Alto Rendimiento</option>
                            <option value="Sistema Aislado / Software a la medida (DIR_02)">Software a Medida / SaaS / Sistema Interno</option>
                            <option value="Re-branding / Posicionamiento Visual">Re-branding / Posicionamiento Visual Premium</option>
                            <option value="Consultoría Técnica">Consultoría Técnica / Auditoría</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">05. Brief de Operación (¿Qué quieres lograr?)</label>
                        <textarea id="brief" class="form-textarea" placeholder="Describe brevemente tu objetivo o el problema que buscas resolver en tu negocio. Se directo." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">06. Capacidad de Despliegue (Rango de Inversión)</label>
                        <select id="presupuesto" class="form-select" required>
                            <option value="" disabled selected>Selecciona tu rango de presupuesto asignado...</option>
                            <option value="< $1,000 USD (Despliegue Rápido)">&lt; $1,000 USD (Módulos Básicos / Despliegue Rápido)</option>
                            <option value="$1,000 - $3,000 USD (Ecosistema Estándar)">$1,000 - $3,000 USD (Ecosistemas Estándar B2B)</option>
                            <option value="$3,000 - $10,000+ USD (Enterprise)">$3,000 - $10,000+ USD (Arquitectura Enterprise / Custom)</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
                        Transmitir Datos al CTO
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Lógica de Interceptación y Enrutamiento a WhatsApp
        function enviarWhatsApp(event) {
            event.preventDefault(); // Evita que la página se recargue

            // Recolectar datos del DOM
            const nombre = document.getElementById('nombre').value.trim();
            const empresa = document.getElementById('empresa').value.trim();
            
            // Obtener el radio button seleccionado
            const infraRadios = document.getElementsByName('infraestructura');
            let infraestructura = '';
            for (let i = 0; i < infraRadios.length; i++) {
                if (infraRadios[i].checked) {
                    infraestructura = infraRadios[i].value;
                    break;
                }
            }

            const servicio = document.getElementById('servicio').value;
            const brief = document.getElementById('brief').value.trim();
            const presupuesto = document.getElementById('presupuesto').value;

            // Formatear el payload para WhatsApp (Usando codificación URI)
            const numeroTarget = "50768529324";
            
            let mensaje = `*INICIALIZACIÓN DE PROYECTO: DISK CREATIVO* 💿🚀\n\n`;
            mensaje += `👤 *Emisor:* ${nombre}\n`;
            mensaje += `🏢 *Entidad:* ${empresa}\n`;
            mensaje += `⚙️ *Infraestructura Actual:* ${infraestructura}\n`;
            mensaje += `🛠️ *Módulo Requerido:* ${servicio}\n`;
            mensaje += `💰 *Rango de Inversión:* ${presupuesto}\n\n`;
            mensaje += `📝 *Brief Operativo:*\n"${brief}"`;

            // Codificar el texto para URL
            const mensajeCodificado = encodeURIComponent(mensaje);
            
            // Construir la URL final de la API de WhatsApp
            const urlWhatsApp = `https://wa.me/${numeroTarget}?text=${mensajeCodificado}`;

            // Redirigir al usuario en una nueva pestaña
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
